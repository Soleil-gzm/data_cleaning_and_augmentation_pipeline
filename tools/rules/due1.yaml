rules:
  - description: "M1-1 句式1"
    pattern: '目前系统显示你的总本金是[\d.]+元，但是现在只需要你把逾期金额(?P<amount>[\d.]+)元还掉就能摆脱逾期了，你这边没问题吧？'
    replacement: '具体的账单组成建议您可以登录星图金融APP查询，但是现在需要你把逾期金额{amount}元还掉才能摆脱逾期状态，你这边没问题吧？'

  - description: "M1-1 句式2"
    pattern: '这个系统显示你的总本金是[\d.]+元，现在需要你还的是逾期金额(?P<amount>[\d.]+)元，还了这个钱你就不逾期了，你这边能还吗？'
    replacement: '这个建议您可以登录星图金融APP查询，现在需要你还的是逾期金额{amount}元，还了这个钱你就不逾期了，你这边能还吗？'

  - description: "M1-1 句式3"
    pattern: '现在看到你总共是欠了[\d.]+元，如果你想要还全款建议你咨询客服，现在需要你至少先把(?P<amount>[\d.]+)元还进来，没问题吧？'
    replacement: '具体总欠款是多少您可以登录APP查询，如果你想要还全款建议你咨询客服，现在需要你至少先把{amount}元还进来，没问题吧？'

  - description: "M1-1 句式4"
    pattern: '你一共欠了[\d.]+元，因为你是办理的分期，如果你想要都还掉，建议你咨询客服，现在需要你先把(?P<amount>[\d.]+)元还进来，你这边能还吗？'
    replacement: '总欠款的问题您可以登录APP查询，如果你想要还全款的话，建议你咨询客服，现在需要你把{amount}元还进来，你这边能还吗？'

  - description: "M1-1 句式5"
    pattern: '截止目前你的总欠款是[\d.]+元，你可以记一下，但是现在只需要你把(?P<amount>[\d.]+)元还进来就可以摆脱逾期状态了。'
    replacement: '这个建议您登录APP查询，现在需要你把{amount}元还进来，这样就可以摆脱逾期状态了，剩下的你后续按照账单还款就可以了。'

  - description: "M1-1 句式6"
    pattern: '目前为止你的总欠款是[\d.]+元，但是你现在只需要还(?P<amount>[\d.]+)元就可以摆脱逾期了。'
    replacement: '这个需要您登录APP查询，上面都是有的，现在需要您把逾期金额{amount}元还进来，先摆脱逾期状态，知道吧？'

  - description: "M1-1 句式7"
    pattern: '[\d.]+元是你目前的全部欠款，但是我们让你还的只有(?P<amount>[\d.]+)元，你还够这个钱就可以摆脱逾期了，剩下的你每个月按照账单还就可以了。'
    replacement: '总欠款的问题建议您登录APP查询，现在需要你还的是{amount}元，你还够这个钱就可以摆脱逾期了，剩下的你每个月按照账单还就可以了。'

  - description: "M1-1 句式8"
    pattern: '系统显示你现在总欠款金额是[\d.]+元，但是我们现在还没有让你还全款，只是让你先把(?P<amount>[\d.]+)元还进来，先摆脱逾期状态。'
    replacement: '这个需要您登录APP查询，但是现在你只要把{amount}元还进来就可以摆脱逾期状态了，你这边能还吗？'

  - description: "M1-1 句式9"
    pattern: '[\d.]+元是你总共欠的钱，现在我们还没有让你还这么多，只是让你先把(?P<amount>[\d.]+)元还进来，你这边能还吗？'
    replacement: '这个建议您登录APP查询，现在需要您还的是{amount}元，您这边能还吗？'

  - description: "M1-1 句式10"
    pattern: '目前系统显示你总欠款是[\d.]+元，具体你也可以登录APP查看。'
    replacement: '具体总欠款是多少您可以登录APP查询，上面都是有的，您这边尽快处理下逾期欠款吧。'

  - description: "M1-1 句式11"
    pattern: '你总欠款是[\d.]+元，你还的这个钱都会直接从总欠款减去，正常情况下都会优先抵扣息费。'
    replacement: '你还的这个钱会直接从总欠款中减掉，正常情况下会优先抵扣息费。'

  - description: "M1-1 句式12"
    pattern: '剩下的我再帮您申请一点时间'
    replacement: '剩下的您再去想想办法'

  - description: "M1-1 句式13"
    pattern: '剩下的款项我这边再去帮您申请一点时间'
    replacement: '剩下的款项您再去想想办法'