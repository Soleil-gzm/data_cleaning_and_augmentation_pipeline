rules:
  - description: "M0-1 句式1"
    pattern: '目前系统显示您的总本金是[\d.]+元，但是现在需要您按照账单把(?P<amount>[\d.]+)元处理掉，您这边尽快安排下还款吧。'
    replacement: '具体的账单组成建议您可以登录星图金融APP查询，但是现在需要您按照账单把{amount}元处理掉，您这边尽快安排下还款吧。'

  - description: "M0-1 句式2"
    pattern: '现在看到您总共是欠了[\d.]+元，您如果想要还全款的话建议您咨询客服，但是建议您可以先把这期的钱还了，知道吧？'
    replacement: '具体总欠款是多少您可以登录APP查询，如果您想要还全款的话建议您咨询客服，但是建议您可以先把这期的钱还了，知道吧？'

  - description: "M0-1 句式3"
    pattern: '截止目前您的总欠款是[\d.]+元，您现在需要还(?P<amount>[\d.]+)元，剩下的您后续按照账单还就行了，明白吗？'
    replacement: '这个建议您登录APP查询，现在需要您处理的是{amount}元，剩下的您后续按照账单还就行了，明白吗？'

  - description: "M0-1 句式4"
    pattern: '[\d.]+元是您目前的全部欠款，您现在需要还的是(?P<amount>[\d.]+)元，知道吧？'
    replacement: '总欠款的问题您可以登录APP查询，您现在需要还的是{amount}元，知道吧？'