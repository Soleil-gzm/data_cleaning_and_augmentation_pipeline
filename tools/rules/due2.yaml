rules:
  - description: "M1-2 句式1"
    pattern: '目前系统显示你的总本金是[\d.]+元，但是现在只需要你把逾期金额(?P<amount>[\d.]+)元还掉就能摆脱逾期了，你这边没问题吧？'
    replacement: '目前系统显示你本期应还的本金是{本金}，具体的你可以登录APP查询，但是现在需要你把逾期金额{amount}元还掉才能摆脱逾期状态，你这边没问题吧？'

  - description: "M1-2 句式2"
    pattern: '这个系统显示你的总本金是[\d.]+元，现在需要你还的是逾期金额(?P<amount>[\d.]+)元，还了这个钱你就不逾期了，你这边能还吗？'
    replacement: '目前系统显示你本期应还的本金是{本金}，具体的你可以登录APP查询，现在需要你还的是逾期金额{amount}元，还了这个钱你就不逾期了，你这边能还吗？'
